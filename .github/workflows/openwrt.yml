name: OpenWrt packages

# Builds the .ipk (OpenWrt 24.10, opkg) and .apk (OpenWrt 25.12, apk-tools)
# packages for every architecture in openwrt/sdk.env with the official SDK
# images, and attaches them to the tag's GitHub release, which release.yml
# creates. To add packages to an existing release: Actions → OpenWrt packages
# → Run workflow (from main), with the tag. The packaging (openwrt/, scripts/)
# comes from the commit the workflow runs on, the source from the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: openwrt-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.m.outputs.releases }}
      arches: ${{ steps.m.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          . openwrt/sdk.env
          list() { printf '%s\n' $1 | jq -R . | jq -cs .; }
          echo "releases=$(list "$OPENWRT_RELEASES")" >> "$GITHUB_OUTPUT"
          echo "arches=$(list "$OPENWRT_ARCHES")" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.matrix.outputs.releases) }}
        arch: ${{ fromJSON(needs.matrix.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tag's tree is what gets packaged
      # Bootstraps the SDK's host Go, which otherwise builds its own chain of
      # bootstrap compilers first.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      # Source tarballs, the Go toolchain source and the module cache.
      - uses: actions/cache@v4
        with:
          path: out/openwrt/dl
          key: openwrt-dl-${{ matrix.release }}-${{ hashFiles('go.sum', 'openwrt/*/Makefile') }}
          restore-keys: openwrt-dl-${{ matrix.release }}-
      - name: Build
        env:
          SOURCE_REF: refs/tags/${{ env.TAG }}
        run: scripts/openwrt-package.sh "${{ matrix.arch }}" "${{ matrix.release }}" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.release }}-${{ matrix.arch }}
          path: out/openwrt/perch-apd_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The manifest's inputs (release.env, sdk.env, files.json, the kit
      # version in go.mod) come from the tag.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: openwrt-*
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd packages
          sha256sum perch-apd_* > openwrt-packages.sha256
          cat openwrt-packages.sha256
          # On a tag push release.yml creates the release; wait for it.
          for i in $(seq 1 45); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG"; sleep 20
          done
          gh release upload "$TAG" perch-apd_* openwrt-packages.sha256 --clobber
      # The UNSIGNED manifest of every artefact (agent-updates protocol.md 1.1).
      # CI never signs: the owner runs scripts/sign-release.sh, which rebuilds
      # everything, compares, signs with his key and attaches the .sig. Until
      # then controllers list the release as unsigned and offer nothing.
      - name: Unsigned manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          for i in $(seq 1 45); do
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx perch-apd-files.tar.gz && break
            echo "waiting for the binaries of $TAG"; sleep 20
          done
          gh release download "$TAG" -D release -p 'perch-apd-linux-*' -p 'perch-apd-files.tar.gz'
          cp packages/perch-apd_* release/
          . ./release.env
          go run github.com/capthndsme/perch-agentkit/cmd/perch-release manifest \
            -product perch-apd -version "${TAG#v}" -commit "$(git rev-parse HEAD)" \
            -notes-url "https://github.com/$GH_REPO/releases/tag/$TAG" \
            -min-version "$MIN_VERSION" -min-from-version "$MIN_FROM_VERSION" \
            -min-controller-version "$MIN_CONTROLLER_VERSION" \
            -sdk-env openwrt/sdk.env -files-spec openwrt/perch-apd/files.json \
            -o perch-manifest.json release
          gh release upload "$TAG" perch-manifest.json --clobber
